<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gallery | CVR ACM Student Chapter</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Local gallery styles */
    .gallery-page {
      padding: 8rem 2rem 6rem;
      max-width: 1200px;
      margin: 0 auto;
      min-height: 100vh;
    }

    .gallery-header {
      text-align: center;
      margin-bottom: 5rem;
    }

    /* Filter tabs */
    .gallery-filters {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 3rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.6rem 1.5rem;
      border-radius: 20px;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .filter-btn:hover, .filter-btn.active {
      border-color: var(--accent);
      color: #fff;
      background: rgba(0, 200, 255, 0.05);
      box-shadow: 0 0 15px rgba(0, 200, 255, 0.1);
    }

    /* Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 2rem;
    }

    .gallery-card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface);
      aspect-ratio: 4/3;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .gallery-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .gallery-card:hover {
      border-color: var(--accent);
      box-shadow: 0 10px 30px rgba(0, 200, 255, 0.2);
      transform: translateY(-5px);
    }

    .gallery-card:hover img {
      transform: scale(1.05);
    }

    .gallery-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(2, 10, 15, 0.9) 0%, rgba(2, 10, 15, 0.2) 60%, transparent 100%);
      opacity: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 1.5rem;
      transition: opacity 0.3s ease;
      z-index: 2;
    }

    .gallery-card:hover .gallery-card-overlay {
      opacity: 1;
    }

    .gallery-card-tag {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    .gallery-card-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      color: #fff;
    }

    /* Lightbox Modal */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 10, 15, 0.95);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .lightbox.active {
      display: flex;
      opacity: 1;
    }

    .lightbox-content {
      max-width: 90%;
      max-height: 80%;
      position: relative;
    }

    .lightbox-content img {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 80vh;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }

    .lightbox-caption {
      color: #fff;
      text-align: center;
      margin-top: 1rem;
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
    }

    .lightbox-close {
      position: absolute;
      top: -40px;
      right: 0;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      background: none;
      border: none;
      font-family: 'Syne', sans-serif;
    }

    @media (max-width: 768px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- NAVIGATION -->
  <nav>
    <a href="index.html" class="nav-logo">
      <div class="acm-badge">
        <img src="logo.jpeg" class="nav-logo-img" alt="ACM CVR Logo">
      </div>
      <span>CVR · ACM</span>
    </a>
    <div class="nav-links">
      <a href="index.html#about">About</a>
      <a href="index.html#events">Events</a>
      <a href="index.html#team">Team</a>
      <a href="events.html">Past Events</a>
      <a href="index.html#join">Join</a>
    </div>
    <button class="nav-cta" onclick="window.location.href='index.html#join'">Join Us</button>
  </nav>

  <!-- GALLERY CONTENT -->
  <main class="gallery-page">
    <div class="gallery-header">
      <div class="section-label">Moments</div>
      <h1 class="section-heading">Visual Highlights</h1>
      <p class="events-intro" style="margin: 1.5rem auto 0; max-width: 600px;">
        Browse through photos from our chapter's events, celebrations, and workshops.
      </p>
    </div>

    <!-- Filters -->
    <div class="gallery-filters">
      <button class="filter-btn active" onclick="filterGallery('all')">All Moments</button>
      <button class="filter-btn" onclick="filterGallery('inauguration')">Inauguration</button>
      <button class="filter-btn" onclick="filterGallery('contests')">Coding Contests</button>
    </div>

    <!-- Grid -->
    <div class="gallery-grid">
      
      <!-- CARD 1: INAUGURATION -->
      <div class="gallery-card filter-item inauguration" onclick="openLightbox('inauguration.jpeg', 'Chapter Inauguration Group Photo (March 2, 2026)')">
        <img src="inauguration.jpeg" alt="ACM Inauguration Ceremony">
        <div class="gallery-card-overlay">
          <div class="gallery-card-tag">Inauguration</div>
          <div class="gallery-card-title">Chapter Launch Ceremony</div>
        </div>
      </div>

    </div>
  </main>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <div class="lightbox-content" onclick="event.stopPropagation()">
      <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
      <img src="" id="lightbox-img" alt="Enlarged gallery photo">
      <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <div class="footer-left">
      <div class="footer-brand">CVR ACM Student Chapter</div>
      <div class="footer-sub">CVR College of Engineering · Hyderabad</div>
    </div>

    <div class="footer-right">
      <a href="https://instagram.com/acm_cvr" target="_blank" class="social-btn">Instagram</a>
      <a href="https://www.linkedin.com/company/acmsc-cvrce/" target="_blank" class="social-btn">LinkedIn</a>
      <a href="https://github.com/acmcvrsc" target="_blank" class="social-btn">GitHub</a>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    // Gallery Javascript
    function filterGallery(category) {
      // Update buttons
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.currentTarget.classList.add('active');

      // Filter items
      const cards = document.querySelectorAll('.gallery-card');
      cards.forEach(card => {
        if (category === 'all' || card.classList.contains(category)) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }

    function openLightbox(imgSrc, caption) {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      const lightboxCaption = document.getElementById('lightbox-caption');

      lightboxImg.src = imgSrc;
      lightboxCaption.textContent = caption;
      lightbox.classList.add('active');
    }

    function closeLightbox() {
      const lightbox = document.getElementById('lightbox');
      lightbox.classList.remove('active');
    }
  </script>
</body>
</html>
